apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def version = providers.exec {
    workingDir(projectDir)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(
      major,
      minor,
      patch
  )
}
def rnVersion = getRNVersion()

// ── Release signing values: read from the environment first, then Gradle properties. Never printed. ──
def buildSecret(String name) {
  def value = System.getenv(name) ?: findProperty(name)
  return value == null ? '' : value.toString().trim()
}
def releaseSigningValue = { String name -> buildSecret(name) }
def releaseSigningProvided = ['ZUTSAV_RELEASE_STORE_FILE', 'ZUTSAV_RELEASE_STORE_PASSWORD', 'ZUTSAV_RELEASE_KEY_ALIAS', 'ZUTSAV_RELEASE_KEY_PASSWORD']
    .every { !buildSecret(it).isEmpty() }

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        /* Autolinking */
        autolinkLibrariesWithApp()
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.zutsav.app'
    defaultConfig {
        applicationId 'com.zutsav.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Local release signing, only when ALL four values are provided (environment or Gradle properties).
        // On EAS Build the managed credentials are injected on top of this and take over `release`.
        if (releaseSigningProvided) {
            release {
                storeFile file(releaseSigningValue('ZUTSAV_RELEASE_STORE_FILE'))
                storePassword releaseSigningValue('ZUTSAV_RELEASE_STORE_PASSWORD')
                keyAlias releaseSigningValue('ZUTSAV_RELEASE_KEY_ALIAS')
                keyPassword releaseSigningValue('ZUTSAV_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Never the debug keystore. Without credentials this is null and packaging a release is refused
            // (see the taskGraph check below) instead of producing a debug-signed "release".
            signingConfig releaseSigningProvided ? signingConfigs.release : null
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
        // Standalone INTERNAL testing build for a backend on the local Wi-Fi (`./gradlew assembleLocalTest`). It is `release` plus
        // exactly one difference: src/localTest/ adds a network-security-config that permits cleartext HTTP to the single LAN host
        // listed there (every other host stays HTTPS-only). The `release` build type and the main manifest are not touched, and this
        // variant needs the same release signing (never the debug key) — see the second taskGraph check at the end of this file.
        localTest {
            initWith release
            matchingFallbacks = ['release']
            signingConfig releaseSigningProvided ? signingConfigs.release : null
            versionNameSuffix '-localtest'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle");
    applyNativeModulesAppBuildGradle(project)
}

// Refuse to package an unsigned or debug-signed release. EAS Build injects the managed signing config at
// configuration time, so this only trips for local `assembleRelease` / `bundleRelease` without credentials.
gradle.taskGraph.whenReady { graph ->
    def packagesRelease = graph.allTasks.any { it.project == project && it.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'packageReleaseBundle'] }
    if (!packagesRelease) return
    def releaseSigning = android.buildTypes.release.signingConfig
    if (releaseSigning == null || releaseSigning.name == 'debug') {
        throw new GradleException(
            'Release signing is not configured. Provide ZUTSAV_RELEASE_STORE_FILE, ZUTSAV_RELEASE_STORE_PASSWORD, ' +
            'ZUTSAV_RELEASE_KEY_ALIAS and ZUTSAV_RELEASE_KEY_PASSWORD (environment or Gradle properties), or build with EAS ' +
            'Build, which injects its managed credentials. A release build is never signed with the debug keystore.')
    }
}

// The local-testing variant gets the same signing requirement as release, and its cleartext exception must match the backend host the
// JS bundle is being built for: the API and base URLs (build-time EXPO_PUBLIC_*) must be http:// URLs whose host is listed in
// src/localTest/res/xml/network_security_config_localtest.xml. Refusing here is safer than an APK that cannot reach its own backend
// or that quietly depends on a host the config does not name.
gradle.taskGraph.whenReady { graph ->
    def packagesLocalTest = graph.allTasks.any { it.project == project && it.name in ['assembleLocalTest', 'packageLocalTest', 'bundleLocalTest', 'packageLocalTestBundle'] }
    if (!packagesLocalTest) return
    def localTestSigning = android.buildTypes.localTest.signingConfig
    if (localTestSigning == null || localTestSigning.name == 'debug') {
        throw new GradleException(
            'Release signing is not configured for the local-testing build. Provide ZUTSAV_RELEASE_STORE_FILE, ZUTSAV_RELEASE_STORE_PASSWORD, ' +
            'ZUTSAV_RELEASE_KEY_ALIAS and ZUTSAV_RELEASE_KEY_PASSWORD. It is never signed with the debug keystore.')
    }
    def permitted = new XmlSlurper().parse(file('src/localTest/res/xml/network_security_config_localtest.xml'))
        .'domain-config'.domain*.text()*.trim()
    ['EXPO_PUBLIC_API_URL', 'EXPO_PUBLIC_BASE_URL'].each { name ->
        def value = (System.getenv(name) ?: '').trim()
        def uri = value ? new URI(value) : null
        if (uri == null || uri.scheme != 'http' || uri.host == null || !(uri.host in permitted)) {
            throw new GradleException(
                "The local-testing build needs ${name} set to an http:// URL on a host listed in " +
                'src/localTest/res/xml/network_security_config_localtest.xml (currently: ' + permitted.join(', ') + ').')
        }
    }
}
