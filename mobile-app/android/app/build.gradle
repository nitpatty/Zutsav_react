apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def version = providers.exec {
    workingDir(projectDir)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(
      major,
      minor,
      patch
  )
}
def rnVersion = getRNVersion()

// ── Signing values: read from the environment first, then Gradle properties. Never printed. ──
// Three SEPARATE identities, each with its own four variables (<PREFIX>_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD):
//   ZUTSAV_PUBLIC_RELEASE  production signing of the Public app   (com.zutsav.app)
//   ZUTSAV_ADMIN_RELEASE   production signing of the Admin app    (com.zutsav.app.admin)
//   ZUTSAV_LOCALTEST       internal-testing key for the localTest build type (either flavor); never a production key
// Nothing falls back from one identity to another, to the debug keystore, or to the old generic ZUTSAV_RELEASE_* names.
def buildSecret(String name) {
  def value = System.getenv(name) ?: findProperty(name)
  return value == null ? '' : value.toString().trim()
}
def signingParts = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
def signingValue = { String prefix, String part -> buildSecret("${prefix}_${part}") }
def signingProvided = { String prefix -> signingParts.every { !signingValue(prefix, it).isEmpty() } }
def PUBLIC_RELEASE_SIGNING = 'ZUTSAV_PUBLIC_RELEASE'
def ADMIN_RELEASE_SIGNING = 'ZUTSAV_ADMIN_RELEASE'
def LOCALTEST_SIGNING = 'ZUTSAV_LOCALTEST'

// Each flavor's JavaScript bundle is built for exactly one Metro variant (see metro.config.js / build-config/metroVariant.js).
def flavorMetroVariants = [publicApp: 'public', adminApp: 'admin']

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    //   With product flavors the debug variants are no longer named just 'debug': without this list they would be treated
    //   as release-like and embed a JS bundle instead of loading from Metro.
    debuggableVariants = ["publicAppDebug", "adminAppDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        /* Autolinking */
        autolinkLibrariesWithApp()
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // The namespace (the Kotlin/Java package of MainActivity, R, BuildConfig) stays com.zutsav.app for both apps; only the
    // applicationId (the installed identity) differs, so no source file moves.
    namespace 'com.zutsav.app'
    defaultConfig {
        applicationId 'com.zutsav.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Public (com.zutsav.app) and Admin (com.zutsav.app.admin) are different packages, so each keeps its own,
        // independent versionCode history. Bump them per distribution of that app.
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The three identities below always EXIST but are only FILLED when all four of their values are provided. An empty
        // one cannot sign anything: packaging fails (validateSigning) instead of falling back to another key.
        publicRelease {
            if (signingProvided(PUBLIC_RELEASE_SIGNING)) {
                storeFile file(signingValue(PUBLIC_RELEASE_SIGNING, 'STORE_FILE'))
                storePassword signingValue(PUBLIC_RELEASE_SIGNING, 'STORE_PASSWORD')
                keyAlias signingValue(PUBLIC_RELEASE_SIGNING, 'KEY_ALIAS')
                keyPassword signingValue(PUBLIC_RELEASE_SIGNING, 'KEY_PASSWORD')
            }
        }
        adminRelease {
            if (signingProvided(ADMIN_RELEASE_SIGNING)) {
                storeFile file(signingValue(ADMIN_RELEASE_SIGNING, 'STORE_FILE'))
                storePassword signingValue(ADMIN_RELEASE_SIGNING, 'STORE_PASSWORD')
                keyAlias signingValue(ADMIN_RELEASE_SIGNING, 'KEY_ALIAS')
                keyPassword signingValue(ADMIN_RELEASE_SIGNING, 'KEY_PASSWORD')
            }
        }
        localTest {
            if (signingProvided(LOCALTEST_SIGNING)) {
                storeFile file(signingValue(LOCALTEST_SIGNING, 'STORE_FILE'))
                storePassword signingValue(LOCALTEST_SIGNING, 'STORE_PASSWORD')
                keyAlias signingValue(LOCALTEST_SIGNING, 'KEY_ALIAS')
                keyPassword signingValue(LOCALTEST_SIGNING, 'KEY_PASSWORD')
            }
        }
    }
    flavorDimensions 'appVariant'
    productFlavors {
        // Public Zutsav: user + pandit. Label "Zutsav" and the launcher icon come from src/main (unchanged).
        publicApp {
            dimension 'appVariant'
            manifestPlaceholders = [appScheme: 'zutsav']
            // The Metro port this app's debug build looks for. A debug APK has the port baked in (react_native_dev_server_port,
            // set by the React Native plugin from -PreactNativeDevServerPort in defaultConfig; this flavor value takes precedence),
            // so two apps that need DIFFERENT Metro variants must use different ports to run at the same time.
            resValue 'integer', 'react_native_dev_server_port', '8081'
            signingConfig signingConfigs.publicRelease
        }
        // Private Zutsav Admin: com.zutsav.app.admin. Label and icon are overlaid from src/adminApp/res.
        adminApp {
            dimension 'appVariant'
            applicationIdSuffix '.admin'
            manifestPlaceholders = [appScheme: 'zutsavadmin']
            resValue 'integer', 'react_native_dev_server_port', '8082'
            signingConfig signingConfigs.adminRelease
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // No signingConfig here on purpose: each flavor supplies its own production identity (publicRelease /
            // adminRelease above). Never the debug keystore. Without that flavor's credentials packaging is refused by
            // the taskGraph guard at the end of this file instead of producing a debug-signed or wrongly-signed "release".
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
        // Standalone INTERNAL testing build for a backend on the local Wi-Fi (`./gradlew assemblePublicAppLocalTest` / `assembleAdminAppLocalTest`).
        // It is `release` plus exactly one difference: src/localTest/ adds a network-security-config that permits cleartext HTTP to the
        // single LAN host listed there (every other host stays HTTPS-only). The `release` build type and the main manifest are not
        // touched. It is signed ONLY with the internal-testing identity (ZUTSAV_LOCALTEST_*): always that config (never null, so a
        // flavor's production key cannot be inherited), never the debug key, never a production key. See the guards at the end of this file.
        localTest {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.localTest
            versionNameSuffix '-localtest'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle");
    applyNativeModulesAppBuildGradle(project)
}

// ── Metro variant per flavor ──
// The React Native Gradle plugin bundles every non-debuggable variant with `node <cliFile> export:embed ...`, run through
// project.exec, which has NO per-task environment: a variable assigned here would never reach the process that loads Metro.
// So each createBundle<Variant>JsAndAssets task is pointed at scripts/gradle-bundle.js instead. That script sets
// ZUTSAV_APP_VARIANT (Metro module selection) and EXPO_PUBLIC_APP_VARIANT (client config, e.g. the deep-link scheme) for the
// Expo CLI child process and then runs the real Expo CLI with all the remaining arguments. A bundle task whose flavor is not
// listed in flavorMetroVariants fails the build rather than being bundled for a guessed variant.
//
// Ordering matters: the React Native plugin registers these tasks (and sets their cliFile) when the Android plugin reports the
// variants, which happens in afterEvaluate. A configureEach registered earlier ran BEFORE that and was silently overwritten
// (the Admin bundle then contained the Public stub), so the override is applied afterwards, through named().configure, whose
// actions run after the plugin's own. As a second, independent check each task verifies after it ran that the wrapper
// really executed for the expected variant (it writes zutsav-variant.txt next to the intermediate source map only after a
// successful bundle); a task that skipped the wrapper fails instead of leaving a bundle of unknown variant for packaging.
afterEvaluate {
    def bundleTaskNames = tasks.names.findAll { it ==~ /^createBundle.+JsAndAssets$/ }
    // Every variant that embeds JavaScript (all but the debuggable ones) must have its bundle task wired below.
    android.applicationVariants.all { variant ->
        if (variant.name in ['publicAppDebug', 'adminAppDebug']) return
        def expectedTask = "createBundle${variant.name.capitalize()}JsAndAssets".toString()
        if (!(expectedTask in bundleTaskNames)) {
            throw new GradleException("Variant '${variant.name}' has no ${expectedTask} task to wire to a Metro variant; refusing to continue.")
        }
    }
    bundleTaskNames.each { taskName ->
        def flavor = flavorMetroVariants.keySet().find { taskName.startsWith("createBundle${it.capitalize()}".toString()) }
        if (flavor == null) {
            throw new GradleException("Task '${taskName}' bundles JavaScript for a variant whose flavor is not mapped to a Metro variant " +
                "(${flavorMetroVariants.keySet().join(', ')}). Refusing to bundle for a guessed variant.")
        }
        def metroVariant = flavorMetroVariants[flavor]
        // Release bundles are validated against the production endpoints by scripts/gradle-bundle.js; the local-testing build is
        // not (it has its own LAN rules in the packaging guards below). Any other bundle task is refused rather than guessed.
        def bundleBuildType = taskName.endsWith('ReleaseJsAndAssets') ? 'release' : (taskName.endsWith('LocalTestJsAndAssets') ? 'localtest' : null)
        if (bundleBuildType == null) {
            throw new GradleException("Task '${taskName}' is neither a Release nor a LocalTest bundle; refusing to bundle a build of unknown kind.")
        }
        tasks.named(taskName).configure { task ->
            task.cliFile.set(file("${projectRoot}/scripts/gradle-bundle.js"))
            task.extraPackagerArgs.addAll('--zutsav-app-variant', metroVariant, '--zutsav-build-type', bundleBuildType)
            // Expo inlines these into the bundle, but Gradle does not know the bundler reads them. As inputs, a changed endpoint
            // re-runs the task instead of packaging a bundle built for the previous values.
            ['EXPO_PUBLIC_API_URL', 'EXPO_PUBLIC_BASE_URL', 'EXPO_PUBLIC_WEB_URL'].each { envName ->
                task.inputs.property("zutsav.${envName}".toString(), providers.environmentVariable(envName).orElse(''))
            }
            def marker = { new File(task.jsIntermediateSourceMapsDir.get().asFile, 'zutsav-variant.txt') }
            task.doFirst { marker().delete() }
            task.doLast {
                def written = marker().isFile() ? marker().text.trim() : ''
                if (written != "variant=${metroVariant}".toString()) {
                    throw new GradleException("${task.name} did not run through scripts/gradle-bundle.js for the '${metroVariant}' variant " +
                        "(marker: '${written}'). Refusing to leave a bundle of unknown variant for packaging.")
                }
            }
        }
    }
}

// ── Packaging guards ──
// Every task that can produce an installable or distributable artifact of a release-like variant (APK or AAB) must be signed by
// THAT flavor's own identity. The rule is keyed on the variant name taken from the task name, so a task this file has never
// heard of (a future flavor, a renamed task) is refused instead of slipping through. Aggregate tasks such as assembleRelease
// depend on the per-variant tasks, which are checked. Debug variants are not covered: they are never production artifacts.
// Credentials are named in messages, never printed.
def packagingSigningRules = [
    publicAppRelease  : [config: 'publicRelease', prefix: PUBLIC_RELEASE_SIGNING, what: 'the Public app release (com.zutsav.app)'],
    adminAppRelease   : [config: 'adminRelease',  prefix: ADMIN_RELEASE_SIGNING,  what: 'the Admin app release (com.zutsav.app.admin)'],
    publicAppLocalTest: [config: 'localTest',     prefix: LOCALTEST_SIGNING,      what: 'the Public app local-testing build'],
    adminAppLocalTest : [config: 'localTest',     prefix: LOCALTEST_SIGNING,      what: 'the Admin app local-testing build'],
]
def packagingTaskName = ~/^(assemble|bundle|package|install|sign|validateSigning)(.*?)(Release|LocalTest)(Bundle)?$/

gradle.taskGraph.whenReady { graph ->
    def packagedVariants = [] as Set
    graph.allTasks.findAll { it.project == project }.each { task ->
        def m = packagingTaskName.matcher(task.name)
        if (!m.matches() || m.group(2).isEmpty()) return
        def variantName = m.group(2)[0].toLowerCase() + m.group(2).substring(1) + m.group(3)
        if (!packagedVariants.add(variantName)) return
        def rule = packagingSigningRules[variantName]
        if (rule == null) {
            throw new GradleException("Task '${task.name}' packages the variant '${variantName}', which this build does not recognise " +
                "(known: ${packagingSigningRules.keySet().join(', ')}). Refusing to package a release-like variant without a signing rule.")
        }
        def signing = android.applicationVariants.find { it.name == variantName }?.signingConfig
        if (signing == null || signing.name != rule.config) {
            throw new GradleException("The variant '${variantName}' is not bound to its own signing identity ('${rule.config}'); " +
                'refusing to package it. A release is never signed with the debug keystore or another flavor\'s key.')
        }
        def missing = signingParts.findAll { signingValue(rule.prefix, it).isEmpty() }.collect { "${rule.prefix}_${it}" }
        if (!missing.isEmpty()) {
            throw new GradleException("Signing is not configured for ${rule.what}. Provide ${missing.join(', ')} " +
                '(environment or Gradle properties). It is never signed with the debug keystore, another flavor\'s key or a shared key.')
        }
        if (!file(signingValue(rule.prefix, 'STORE_FILE')).isFile()) {
            throw new GradleException("${rule.prefix}_STORE_FILE does not point to an existing keystore file, so ${rule.what} cannot be signed.")
        }
    }

    // The local-testing variants also need their cleartext exception to match the backend host the JS bundle is built for: the API
    // and base URLs (build-time EXPO_PUBLIC_*) must be http:// URLs whose host is listed in
    // src/localTest/res/xml/network_security_config_localtest.xml. Refusing here is safer than an APK that cannot reach its own
    // backend or that quietly depends on a host the config does not name.
    if (!packagedVariants.any { it.endsWith('LocalTest') }) return
    def permitted = new XmlSlurper().parse(file('src/localTest/res/xml/network_security_config_localtest.xml'))
        .'domain-config'.domain*.text()*.trim()
    ['EXPO_PUBLIC_API_URL', 'EXPO_PUBLIC_BASE_URL'].each { name ->
        def value = (System.getenv(name) ?: '').trim()
        def uri = value ? new URI(value) : null
        if (uri == null || uri.scheme != 'http' || uri.host == null || !(uri.host in permitted)) {
            throw new GradleException(
                "The local-testing build needs ${name} set to an http:// URL on a host listed in " +
                'src/localTest/res/xml/network_security_config_localtest.xml (currently: ' + permitted.join(', ') + ').')
        }
    }
}
